<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tutor de Frações</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>🧠 Tutor de Frações</h1>

        <p class="instrucao">
            Resolva o problema e explique como você chegou ao resultado.
        </p>

        <section class="problema">

            <h2>Resolva:</h2>

            <div class="fracao" id="problema">
                1/2 + 1/3
            </div>

            <button id="novo-exercicio">
                Novo exercício
            </button>

        </section>

        <section class="resposta">

            <label for="resposta">
                Sua resposta:
            </label>

            <input
                type="text"
                id="resposta"
                placeholder="Exemplo: 5/6"
            >

            <label for="raciocinio">
                Como você chegou a esse resultado?
            </label>

            <textarea
                id="raciocinio"
                rows="5"
                placeholder="Explique passo a passo como você resolveu..."
            ></textarea>

            <button id="verificar">
                Verificar resposta
            </button>

        </section>

        <section class="feedback">

            <h2>💡 Feedback do tutor</h2>

            <div id="resultado">
                O feedback aparecerá aqui.
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
